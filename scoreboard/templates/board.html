{% extends "base.html" %}
{% block title %}Naloge - Nordvel CTF{% endblock %}

{% block body %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="mark" href="/naloge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Nordvel CTF</span>
    </a>

    <div class="topbar-right">
      <div class="chip">
        <span class="chip-label">Ekipa</span>
        <span class="chip-value" id="team-name"></span>
      </div>
      <div class="chip">
        <span class="chip-label">Točke</span>
        <span class="chip-value accent" id="score-value"></span>
      </div>
      <a class="logout" href="/odjava" title="Odjava">Odjava</a>
    </div>
  </div>
</header>

<div class="envbar">
  <div class="envbar-inner">
    <span class="envbar-title">Okolje</span>

    <a class="env-item env-link" id="env-target-url" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      <span class="env-label">Tarča</span>
      <code id="env-target-url-text"></code>
    </a>

    <button class="env-item env-copy" data-copy-target="env-target-ip">
      <span class="env-label">IP tarče</span>
      <code id="env-target-ip"></code>
    </button>

    <button class="env-item env-copy" data-copy-target="env-host-ip">
      <span class="env-label">IP gostitelja</span>
      <code id="env-host-ip"></code>
      <span class="env-note">za povratno lupino</span>
    </button>
  </div>
</div>

<main class="wrap">

  <section class="progress-card">
    <div class="progress-head">
      <div>
        <h2>Napredek</h2>
        <p id="progress-sub"></p>
      </div>
      <div class="progress-figure">
        <span id="progress-percent"></span>
      </div>
    </div>
    <div class="track"><div class="fill" id="progress-fill"></div></div>
  </section>

  <section id="finish-panel" class="finish-panel" hidden>
    <div class="trophy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M6 2h12v7a6 6 0 0 1-12 0V2z"/><line x1="12" y1="15" x2="12" y2="19"/>
        <path d="M8 22h8l-1-3H9l-1 3z"/>
      </svg>
    </div>
    <h2>Izziv je rešen</h2>
    <p id="finish-text"></p>
    <div class="finish-score"><span id="finish-score"></span> <small>točk</small></div>
  </section>

  <div id="tasks"></div>

</main>

<div class="toast-host" id="toast-host"></div>
{% endblock %}

{% block scripts %}
<script>window.__STATE__ = {{ state_json|safe }};</script>
<script src="{{ url_for('static', filename='board.js') }}"></script>
{% endblock %}
